name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/bulb-${GOOS}-${GOARCH} ./cmd/bulb
      - uses: actions/upload-artifact@v4
        with:
          name: bulb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/bulb-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  image:
    name: image
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          provenance: false

  chart:
    name: helm-chart
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check chart exists
        id: chart_exists
        run: |
          if [ -f deploy/helm/bulb/Chart.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::deploy/helm/bulb/Chart.yaml not found — skipping chart publish"
          fi
      - uses: azure/setup-helm@v4
        if: steps.chart_exists.outputs.exists == 'true'
      - name: login to ghcr
        if: steps.chart_exists.outputs.exists == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: package and push
        if: steps.chart_exists.outputs.exists == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          helm package deploy/helm/bulb --version "$VERSION" --app-version "$VERSION" -d dist
          helm push dist/bulb-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"

  github_release:
    name: github-release
    needs: [binaries, image, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
