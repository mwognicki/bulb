apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bulb-firewall-agent
  namespace: bulb-system
  labels:
    app.kubernetes.io/name: bulb
    app.kubernetes.io/component: firewall-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bulb
      app.kubernetes.io/component: firewall-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulb
        app.kubernetes.io/component: firewall-agent
    spec:
      hostNetwork: true
      serviceAccountName: bulb-firewall-agent
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: firewall-agent
          image: ghcr.io/mwognicki/bulb:v0.0.6
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
          args:
            - firewall-agent
            - --node-name=$(NODE_NAME)
            - --config-namespace=bulb-system
            - --configmap=bulb-firewall-agent
            - --metrics-bind-address=:9100
            - --health-probe-bind-address=:8081
          volumeMounts:
            - name: dbus-socket
              mountPath: /run/dbus/system_bus_socket
            - name: state-dir
              mountPath: /var/lib/bulb
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
            - name: probes
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: dbus-socket
          hostPath:
            path: /run/dbus/system_bus_socket
            type: Socket
        - name: state-dir
          hostPath:
            path: /var/lib/bulb
            type: DirectoryOrCreate
