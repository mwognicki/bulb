apiVersion: v1
kind: ServiceAccount
metadata:
  name: bulb-controller
  namespace: bulb-system
  labels:
    app.kubernetes.io/name: bulb
    app.kubernetes.io/component: controller
---
# Cluster-wide read on Services/Nodes; cluster-wide write on DaemonSets
# is required because reconciler manages DSes in bulb-system regardless
# of the watched Service's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bulb-controller
  labels:
    app.kubernetes.io/name: bulb
    app.kubernetes.io/component: controller
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["bulb.toturi.tech"]
    resources: ["lbports"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["bulb.toturi.tech"]
    resources: ["lbports/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bulb-controller
  labels:
    app.kubernetes.io/name: bulb
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bulb-controller
subjects:
  - kind: ServiceAccount
    name: bulb-controller
    namespace: bulb-system
---
# Namespace-scoped read on the node-ips ConfigMap (and any other config
# we add later) plus full Lease control for leader election. Keeping
# ConfigMap reads namespaced means a future user-supplied ConfigMap in
# another namespace would be off-limits — that's intentional for now.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bulb-controller
  namespace: bulb-system
  labels:
    app.kubernetes.io/name: bulb
    app.kubernetes.io/component: controller
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bulb-controller
  namespace: bulb-system
  labels:
    app.kubernetes.io/name: bulb
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bulb-controller
subjects:
  - kind: ServiceAccount
    name: bulb-controller
    namespace: bulb-system
