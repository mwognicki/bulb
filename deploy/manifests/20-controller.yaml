apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulb-controller
  namespace: bulb-system
  labels:
    app.kubernetes.io/name: bulb
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bulb
      app.kubernetes.io/component: controller
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulb
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: bulb-controller
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # Pin a concrete release tag. The release workflow publishes
          # ghcr.io/mwognicki/bulb:vX.Y.Z on tag push; bump both this
          # field and BULB_IMAGE below together when upgrading.
          image: ghcr.io/mwognicki/bulb:v0.0.4
          imagePullPolicy: IfNotPresent
          env:
            # Single source of truth for the per-Service proxy
            # DaemonSet image. Must match the controller's own image
            # tag above so a controller rollout and the proxy pods it
            # spawns run the same code.
            - name: BULB_IMAGE
              value: ghcr.io/mwognicki/bulb:v0.0.4
          args:
            - controller
            - --namespace=bulb-system
            - --image=$(BULB_IMAGE)
            - --node-ips-configmap=node-ips
            - --leader-elect=true
            - --metrics-bind-address=:9100
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
            - name: probes
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
