apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulb-controller
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bulb.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "bulb.selectorLabels" (dict "component" "controller" "root" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        {{- include "bulb.selectorLabels" (dict "component" "controller" "root" .) | nindent 8 }}
    spec:
      serviceAccountName: bulb-controller
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "bulb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # BULB_IMAGE must match the controller's own image exactly so that
            # the proxy DaemonSets the controller spawns run the same code.
            # Both references use the same bulb.image helper to guarantee this.
            - name: BULB_IMAGE
              value: {{ include "bulb.image" . }}
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          args:
            - controller
            - --namespace={{ .Values.namespace }}
            - --image=$(BULB_IMAGE)
            - --leader-elect=true
            - --metrics-bind-address=:9100
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
            - name: probes
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 5
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
